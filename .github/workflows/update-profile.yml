name: Update Profile Art

# Regenerates all dynamic SVG assets daily and on push to main.
# - Fetches real contribution data (no auth needed)
# - Renders cyberpunk heatmap SVG
# - Commits changes back to the repo

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 08:30 WIB — runs after midnight commit window
  workflow_dispatch: {}     # manual trigger from Actions tab
  push:
    branches: [main]
    paths-ignore:
      - "assets/header.svg"
      - "assets/avatar.svg"
      - "assets/info-card.svg"
      - "assets/footer.svg"
      - "README.md"

permissions:
  contents: write

jobs:
  refresh-art:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contribution data
        env:
          GH_PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/fetch_contributions.py

      - name: Render contribution heatmap SVG
        run: python scripts/render_heatmap.py

      - name: Commit updated assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-refresh contribution heatmap [skip ci]"
          file_pattern: "data/contributions.json assets/contrib-heatmap.svg"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
